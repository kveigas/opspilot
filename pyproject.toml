[project]
name = "opspilot"
version = "1.0.0-rc1"
description = "OpsPilot — Human Data Campaign Operations Control System"
authors = [{ name = "Kevin Prashant Veigas" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pyright]
include = ["backend/app"]
executionEnvironments = [
  { root = "backend" }
]
