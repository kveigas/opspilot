name: OpsPilot GitHub Pages Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build Frontend for GitHub Pages Production
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: /opspilot/
          VITE_API_BASE_URL: https://opspilot-api.onrender.com
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
