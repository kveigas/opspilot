name: OpsPilot CI Quality Gate

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-gate:
    name: Backend Quality Gate (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy pydantic pytest pytest-cov ruff pyright httpx

      - name: Run Ruff Linter
        run: ruff check backend/app

      - name: Run Pyright Type Checker
        run: pyright backend/app

      - name: Run Pytest Unit & Integration Tests (Coverage >= 90%)
        run: pytest tests/backend/ -v --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend-quality-gate:
    name: Frontend Quality Gate & Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for Backend E2E Server
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies for E2E
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy pydantic httpx

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Axe Accessibility Suite
        working-directory: ./frontend
        run: npx playwright test --workers=1
        env:
          PYTHONPATH: ../backend
