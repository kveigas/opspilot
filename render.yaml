services:
  - type: web
    name: opspilot-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: "pip install fastapi uvicorn sqlalchemy pydantic"
    startCommand: "uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: CORS_ORIGINS
        value: "https://kveigas.github.io,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      - key: DATABASE_PATH
        value: "/tmp/opspilot.db"
